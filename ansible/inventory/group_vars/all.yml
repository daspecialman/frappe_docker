---
app_name: frappe_docker
projects_root: /projects

compose_project_name: frappe

# Path to .env on the server
env_file_path: "{{ projects_root }}/{{ app_name }}/.env"

# Compose files (relative to project root)
compose_files:
  - compose.yaml
  - overrides/compose.mariadb.yaml
  - overrides/compose.redis.yaml
  - overrides/compose.prod.yaml

# ERPNext domain and proxy settings
erpnext_domain: erp.jeyshawnng.com
frappe_frontend_port: 8080

# Environment strategy — local .env sync (generated by Infisical)
sync_env_from_local: true
env_backup: true

# Health check
healthcheck_retries: 15
healthcheck_delay: 10
healthcheck_url: "https://{{ erpnext_domain }}/api/method/ping"
healthcheck_validate_certs: true

# Hooks
# app_pre_deploy_cmd: ""
# app_post_deploy_cmd: ""
# app_migrate_cmd: ""
